name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /tc-presenter/
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Always ship the latest mistlib engine and wrapper without changing
      # package files. Versions are read from the installed package.json files
      # rather than `npm ls`, which exits non-zero once latest no longer matches
      # the pins in package.json. The type-check in the build step gates
      # deployment: API breaks fail the build and the previous Pages deploy
      # stays live.
      - name: Install latest mistlib
        run: |
          # The wrapper declares the engine version it supports as a peer
          # dependency, so pair the latest wrapper with that engine instead of
          # engine@latest (which fails to resolve once the engine is ahead).
          peer=$(npm view @tik-choco/mistlib-web@latest 'peerDependencies.@tik-choco/mistlib')
          npm install --no-save @tik-choco/mistlib-web@latest "@tik-choco/mistlib@${peer:-latest}"
          node -e "for (const p of ['@tik-choco/mistlib', '@tik-choco/mistlib-web']) console.log(p, JSON.parse(require('fs').readFileSync('node_modules/' + p + '/package.json', 'utf8')).version)"

      - name: Build
        run: npx tsc -b && npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
